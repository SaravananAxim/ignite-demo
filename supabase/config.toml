# Auth email templates (local dev only; for hosted use: npm run sync-email-templates).
# content_path is relative to the supabase/ directory (where this config lives). Do NOT use "supabase/..." or you get supabase/supabase/...
[auth.email.template.confirmation]
subject = "Confirm your email – Ignite Franchise Portal"
content_path = "./auth-email-templates/confirm-signup.html"

[auth.email.template.invite]
subject = "You're invited – Ignite Franchise Portal"
content_path = "./auth-email-templates/invite.html"

[auth.email.template.recovery]
