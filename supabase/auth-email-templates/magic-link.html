<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Your sign-in code</title>
  <style type="text/css">
    @media only screen and (max-width: 480px) {
      .outer-pad { padding: 24px 12px !important; }
      .inner-pad { padding: 28px 20px !important; }
      .code { font-size: 22px !important; letter-spacing: 0.12em !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #e8eaef; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" class="outer-pad" style="background-color: #e8eaef; padding: 40px 20px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 480px; margin: 0 auto;">
          <tr>
            <td style="background-color: #ffffff; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); overflow: hidden;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="background-color: #1a2d38; padding: 32px 40px; text-align: center;">
                    <h1 style="margin: 0; color: #ffffff; font-size: 22px; font-weight: 700; letter-spacing: -0.02em;">Ignite Franchise Portal</h1>
                    <p style="margin: 8px 0 0 0; color: rgba(255,255,255,0.8); font-size: 14px;">Sign-in code</p>
                  </td>
                </tr>
                <tr>
                  <td class="inner-pad" style="padding: 40px;">
                    <p style="margin: 0 0 16px 0; color: #0f1729; font-size: 16px; line-height: 1.6;">Enter this 8-digit code in the app to sign in. It works once and expires soon.</p>
                    <p class="code" style="margin: 24px 0; text-align: center; font-size: 28px; font-weight: 700; letter-spacing: 0.2em; color: #30536C; font-family: ui-monospace, monospace;">{{ .Token }}</p>
                    <p style="margin: 0; color: #6b7280; font-size: 14px;">Do not share this code with anyone.</p>
                  </td>
                </tr>
                <tr>
                  <td style="padding: 24px 40px; border-top: 1px solid #e5e7eb; background-color: #f8f9fa;">
                    <p style="margin: 0; color: #6b7280; font-size: 12px;">Ignite Franchise Portal. If you didn't request this, you can ignore this email.</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
